[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cadence"
version = "0.45.0"
description = "Command-line Audio Decoding Engine with Navigation and Continuous Execution"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "platformdirs>=4.0",
    "python-vlc>=3.0",
    "readchar>=4.0",
    "mutagen>=1.48",
    "pynput>=1.8",
    "wcwidth>=0.2",
    "psutil>=7.0",
    "tomli-w>=1.0",
    "pystray>=0.19",
    "pillow>=12.0",
]

[project.scripts]
cadence = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*", "res*"]

[tool.setuptools.package-data]
res = ["*.ico", "*.png"]

[tool.bumpversion]
current_version = "0.45.0"
[[tool.bumpversion.files]]
filename = "src/__init__.py"
search = "version = '{current_version}'"
replace = "version = '{new_version}'"